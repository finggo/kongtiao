<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 空调数据监控</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .data-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 30px;
            width: 100%;
            max-width: 500px;
        }
        
        .card-title {
            font-size: 22px;
            color: #2d3748;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
        }
        
        .data-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f2f5;
            margin-bottom: 10px;
        }
        
        .data-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        
        .label {
            font-size: 18px;
            color: #4a5568;
            font-weight: 500;
        }
        
        .value {
            font-size: 20px;
            color: #007bff;
            font-weight: 600;
        }
        
        .value.empty {
            color: #dc3545;
            font-size: 16px;
        }
        
        .unit {
            font-size: 16px;
            color: #718096;
            margin-left: 5px;
        }
        
        .timestamp {
            margin-top: 20px;
            font-size: 14px;
            color: #718096;
            text-align: center;
        }
        
        .status-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            margin-left: 8px;
        }
        
        .status-online {
            background-color: #d4edda;
            color: #155724;
        }
        
        .refresh-btn {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 0;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 25px;
            transition: background-color 0.3s ease;
        }
        
        .refresh-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="data-card">
        <h2 class="card-title">ESP32 空调数据监控</h2>
        
        <div class="data-item">
            <span class="label">温度</span>
            <span>
                <span id="temperature" class="value">加载中...</span>
                <span class="unit">°C</span>
            </span>
        </div>
        
        <div class="data-item">
            <span class="label">湿度</span>
            <span>
                <span id="humidity" class="value">加载中...</span>
                <span class="unit">%</span>
            </span>
        </div>
        
        <div class="timestamp">
            最后上传时间：<span id="timestamp">--</span>
            <span id="status" class="status-tag status-online"></span>
        </div>
        
        <button class="refresh-btn" onclick="refreshData()">手动刷新</button>
    </div>

    <script>
        // 核心：本地持久化存储（即使页面刷新/关闭也不丢失）
        const STORAGE_KEY = 'esp32_sensor_data';
        let currentData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
            temperature: null,
            humidity: null,
            upload_time: null
        };

        // 初始化UI
        updateUI(currentData);
        // 立即刷新数据
        refreshData();
        // 30秒自动刷新
        setInterval(refreshData, 30000);

        // 更新UI显示
        function updateUI(data) {
            document.getElementById('temperature').textContent = data.temperature || '暂无数据';
            document.getElementById('humidity').textContent = data.humidity || '暂无数据';
            document.getElementById('timestamp').textContent = data.upload_time || '从未上传';
            document.getElementById('temperature').className = data.temperature ? 'value' : 'value empty';
            document.getElementById('humidity').className = data.humidity ? 'value' : 'value empty';
            document.getElementById('status').textContent = data.temperature ? '✅ 数据正常' : '❌ 等待上传';
        }

        // 刷新数据（调用API）
        async function refreshData() {
            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({}),
                    timeout: 10000
                });
                
                const result = await response.json();
                // 如果有新数据，更新本地存储
                if (result.hasRealData && result.data.temperature) {
                    currentData = result.data;
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(currentData));
                }
                updateUI(currentData);
            } catch (error) {
                console.log('使用本地缓存数据');
                updateUI(currentData);
            }
        }

        // 监听Python上传的数据（新增：主动接收上传并更新）
        window.uploadSensorData = function(temperature, humidity, upload_time) {
            currentData = { temperature, humidity, upload_time };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(currentData));
            updateUI(currentData);
        };
    </script>
</body>
</html>
