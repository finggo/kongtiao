<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 空调数据监控</title>
    <style>
        /* 页面基础样式，适配移动端+PC端 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .data-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 30px;
            width: 100%;
            max-width: 500px;
        }
        
        .card-title {
            font-size: 22px;
            color: #2d3748;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
        }
        
        .data-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f2f5;
            margin-bottom: 10px;
        }
        
        .data-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        
        .label {
            font-size: 18px;
            color: #4a5568;
            font-weight: 500;
        }
        
        .value {
            font-size: 20px;
            color: #007bff;
            font-weight: 600;
        }
        
        .unit {
            font-size: 16px;
            color: #718096;
            margin-left: 5px;
        }
        
        .timestamp {
            margin-top: 20px;
            font-size: 14px;
            color: #718096;
            text-align: center;
        }
        
        .refresh-btn {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 0;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 25px;
            transition: background-color 0.3s ease;
        }
        
        .refresh-btn:hover {
            background-color: #0056b3;
        }
        
        .refresh-btn:active {
            background-color: #004085;
        }
        
        /* 加载中样式 */
        .loading {
            color: #9fadc7;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="data-card">
        <h2 class="card-title">ESP32 空调数据监控</h2>
        
        <div class="data-item">
            <span class="label">温度</span>
            <span>
                <span id="temperature" class="value loading">加载中...</span>
                <span class="unit">°C</span>
            </span>
        </div>
        
        <div class="data-item">
            <span class="label">湿度</span>
            <span>
                <span id="humidity" class="value loading">加载中...</span>
                <span class="unit">%</span>
            </span>
        </div>
        
        <div class="timestamp">
            最后更新时间：<span id="timestamp">--</span>
        </div>
        
        <button class="refresh-btn" onclick="refreshData()">手动刷新数据</button>
    </div>

    <script>
        // 页面加载完成后自动刷新数据
        window.onload = function() {
            refreshData();
            // 每隔30秒自动刷新一次
            setInterval(refreshData, 30000);
        };

        // 核心函数：读取data.json并更新页面数据
        function refreshData() {
            // 关键路径：适配public文件夹，必须写全路径
            const dataUrl = '/public/data.json';
            
            // 显示加载状态
            document.getElementById('temperature').textContent = '加载中...';
            document.getElementById('temperature').className = 'value loading';
            document.getElementById('humidity').textContent = '加载中...';
            document.getElementById('humidity').className = 'value loading';

            // 发起请求获取数据
            fetch(dataUrl)
                .then(response => {
                    // 检查响应是否成功
                    if (!response.ok) {
                        throw new Error(`请求失败：${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    // 更新页面数据
                    document.getElementById('temperature').textContent = data.temperature || '--';
                    document.getElementById('temperature').className = 'value';
                    
                    document.getElementById('humidity').textContent = data.humidity || '--';
                    document.getElementById('humidity').className = 'value';
                    
                    document.getElementById('timestamp').textContent = data.timestamp || '未获取到更新时间';
                })
                .catch(error => {
                    // 错误处理
                    console.error('数据加载失败：', error);
                    document.getElementById('temperature').textContent = '加载失败';
                    document.getElementById('humidity').textContent = '加载失败';
                    alert('数据加载失败，请检查网络或稍后重试！');
                });
        }
    </script>
</body>
</html>
