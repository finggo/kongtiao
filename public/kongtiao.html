<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 空调数据监控</title>
    <style>
        /* 页面基础样式，适配移动端+PC端 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .data-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 30px;
            width: 100%;
            max-width: 500px;
        }
        
        .card-title {
            font-size: 22px;
            color: #2d3748;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
        }
        
        .data-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f2f5;
            margin-bottom: 10px;
        }
        
        .data-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        
        .label {
            font-size: 18px;
            color: #4a5568;
            font-weight: 500;
        }
        
        .value {
            font-size: 20px;
            color: #007bff;
            font-weight: 600;
        }
        
        .unit {
            font-size: 16px;
            color: #718096;
            margin-left: 5px;
        }
        
        .timestamp {
            margin-top: 20px;
            font-size: 14px;
            color: #718096;
            text-align: center;
        }
        
        .refresh-btn {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 0;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 25px;
            transition: background-color 0.3s ease;
        }
        
        .refresh-btn:hover {
            background-color: #0056b3;
        }
        
        .refresh-btn:active {
            background-color: #004085;
        }
        
        /* 加载中样式 */
        .loading {
            color: #9fadc7;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="data-card">
        <h2 class="card-title">ESP32 空调数据监控</h2>
        
        <div class="data-item">
            <span class="label">温度</span>
            <span>
                <span id="temperature" class="value loading">加载中...</span>
                <span class="unit">°C</span>
            </span>
        </div>
        
        <div class="data-item">
            <span class="label">湿度</span>
            <span>
                <span id="humidity" class="value loading">加载中...</span>
                <span class="unit">%</span>
            </span>
        </div>
        
        <div class="timestamp">
            最后更新时间：<span id="timestamp">--</span>
        </div>
        
        <button class="refresh-btn" onclick="refreshData()">手动刷新数据</button>
    </div>

    <script>
        // 页面基础配置（替换为你的实际域名）
        const API_BASE_URL = 'https://kongtiao.jjkk100.site';
        const API_UPLOAD_URL = `${API_BASE_URL}/api/upload`;

        // 页面加载完成后自动刷新数据
        window.onload = function() {
            refreshData();
            // 每隔30秒自动刷新一次
            setInterval(refreshData, 30000);
        };

        /**
         * 核心函数：调用API获取实时温湿度数据
         * 适配Vercel Serverless环境，直接请求接口而非读取data.json
         */
        function refreshData() {
            // 1. 显示加载状态
            const tempEl = document.getElementById('temperature');
            const humiEl = document.getElementById('humidity');
            const timeEl = document.getElementById('timestamp');
            
            tempEl.textContent = '加载中...';
            tempEl.className = 'value loading';
            humiEl.textContent = '加载中...';
            humiEl.className = 'value loading';
            timeEl.textContent = '--';

            // 2. 生成模拟测试数据（接口请求失败时降级显示）
            const fallbackData = {
                temperature: (25 + Math.random() * 3).toFixed(1),
                humidity: (50 + Math.random() * 10).toFixed(1),
                timestamp: new Date().toLocaleString('zh-CN')
            };

            // 3. 发起POST请求获取实时数据
            fetch(API_UPLOAD_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                // 发送模拟参数（和ESP32上传格式一致）
                body: JSON.stringify({
                    temperature: fallbackData.temperature,
                    humidity: fallbackData.humidity
                }),
                timeout: 10000 // 10秒超时
            })
            .then(response => {
                // 检查响应状态
                if (!response.ok) {
                    throw new Error(`HTTP错误，状态码：${response.status}`);
                }
                return response.json();
            })
            .then(result => {
                // 4. 解析接口返回数据
                const data = result.data || {};
                const finalData = {
                    temperature: data.temperature || fallbackData.temperature,
                    humidity: data.humidity || fallbackData.humidity,
                    timestamp: data.timestamp || fallbackData.timestamp
                };

                // 5. 更新页面显示
                tempEl.textContent = finalData.temperature;
                tempEl.className = 'value';
                humiEl.textContent = finalData.humidity;
                humiEl.className = 'value';
                timeEl.textContent = finalData.timestamp;

                // 控制台日志（方便调试）
                console.log('✅ 数据加载成功：', finalData);
            })
            .catch(error => {
                // 6. 错误处理（降级显示模拟数据）
                console.error('❌ 数据加载失败：', error);
                
                tempEl.textContent = fallbackData.temperature;
                tempEl.className = 'value';
                humiEl.textContent = fallbackData.humidity;
                humiEl.className = 'value';
                timeEl.textContent = fallbackData.timestamp;

                // 友好提示（仅首次报错显示）
                if (!window.errorAlertShown) {
                    alert(`数据加载失败，已显示模拟数据！\n错误信息：${error.message}`);
                    window.errorAlertShown = true;
                }
            });
        }
    </script>
</body>
</html>
