<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 空调数据监控</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .data-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 30px;
            width: 100%;
            max-width: 500px;
        }
        
        .card-title {
            font-size: 22px;
            color: #2d3748;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
        }
        
        .data-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f2f5;
            margin-bottom: 10px;
        }
        
        .data-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        
        .label {
            font-size: 18px;
            color: #4a5568;
            font-weight: 500;
        }
        
        .value {
            font-size: 20px;
            color: #007bff;
            font-weight: 600;
        }
        
        .value.empty {
            color: #dc3545;
            font-size: 16px;
        }
        
        .unit {
            font-size: 16px;
            color: #718096;
            margin-left: 5px;
        }
        
        .timestamp {
            margin-top: 20px;
            font-size: 14px;
            color: #718096;
            text-align: center;
        }
        
        .timestamp.empty {
            color: #dc3545;
        }
        
        .timestamp.stop {
            color: #ffc107;
        }
        
        .status-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            margin-left: 8px;
        }
        
        .status-online {
            background-color: #d4edda;
            color: #155724;
        }
        
        .status-offline {
            background-color: #f8d7da;
            color: #721c24;
        }
        
        .refresh-btn {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 0;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 25px;
            transition: background-color 0.3s ease;
        }
        
        .refresh-btn:hover {
            background-color: #0056b3;
        }
        
        .refresh-btn:active {
            background-color: #004085;
        }
        
        .loading {
            color: #9fadc7;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="data-card">
        <h2 class="card-title">ESP32 空调数据监控</h2>
        
        <div class="data-item">
            <span class="label">温度</span>
            <span>
                <span id="temperature" class="value loading">加载中...</span>
                <span class="unit">°C</span>
            </span>
        </div>
        
        <div class="data-item">
            <span class="label">湿度</span>
            <span>
                <span id="humidity" class="value loading">加载中...</span>
                <span class="unit">%</span>
            </span>
        </div>
        
        <div class="timestamp" id="timestamp-container">
            Python上传时间：<span id="timestamp">--</span>
            <span id="status-tag" class="status-tag"></span>
        </div>
        
        <button class="refresh-btn" onclick="refreshData()">手动刷新数据</button>
    </div>

    <script>
        // 页面基础配置
        const API_BASE_URL = window.location.origin;
        const API_UPLOAD_URL = `${API_BASE_URL}/api/upload`;
        
        // 核心：本地永久缓存（即使浏览器重启、清除会话也保留）
        let lastRealData = JSON.parse(localStorage.getItem('permanentRealData')) || {
            temperature: null,
            humidity: null,
            upload_time: null
        };

        // 页面加载直接显示本地缓存（不管后端有没有数据）
        window.onload = () => {
            // 优先显示本地永久缓存
            updateUI(lastRealData, false);
            // 再请求后端刷新（更新缓存）
            refreshData();
            // 30秒定时刷新
            setInterval(refreshData, 30000);
        };

        /**
         * 核心函数：更新UI显示（优先用本地缓存）
         */
        function updateUI(data, isNewData = false) {
            const tempEl = document.getElementById('temperature');
            const humiEl = document.getElementById('humidity');
            const timeEl = document.getElementById('timestamp');
            const timeContainer = document.getElementById('timestamp-container');
            const statusTag = document.getElementById('status-tag');

            // 只有拿到新数据时，才更新本地永久缓存
            if (isNewData && data.temperature) {
                lastRealData = { ...data };
                // 存到localStorage，永久保留（除非手动清除）
                localStorage.setItem('permanentRealData', JSON.stringify(lastRealData));
            }

            // 显示逻辑：优先用本地缓存，无则显示暂无数据
            const displayData = lastRealData.temperature ? lastRealData : data;

            if (displayData.temperature && displayData.humidity) {
                tempEl.textContent = displayData.temperature;
                tempEl.className = 'value';
                humiEl.textContent = displayData.humidity;
                humiEl.className = 'value';
                
                if (isNewData) {
                    timeEl.textContent = displayData.upload_time || '未知时间';
                    timeContainer.className = 'timestamp';
                } else {
                    timeEl.textContent = `${displayData.upload_time || '未知时间'}（本地缓存）`;
                    timeContainer.className = 'timestamp stop';
                }
                
                statusTag.textContent = isNewData ? '实时数据' : '本地缓存';
                statusTag.className = `status-tag ${isNewData ? 'status-online' : 'status-offline'}`;
            } else {
                tempEl.textContent = '暂无数据';
                tempEl.className = 'value empty';
                humiEl.textContent = '暂无数据';
                humiEl.className = 'value empty';
                timeEl.textContent = '从未上传过数据';
                timeContainer.className = 'timestamp empty';
                statusTag.textContent = '';
                statusTag.className = 'status-tag';
            }
        }

        /**
         * 核心函数：调用API获取数据（更新本地缓存）
         */
        function refreshData() {
            const tempEl = document.getElementById('temperature');
            const humiEl = document.getElementById('humidity');
            
            // 显示加载状态
            tempEl.textContent = '加载中...';
            tempEl.className = 'value loading';
            humiEl.textContent = '加载中...';
            humiEl.className = 'value loading';

            // 发起API请求
            fetch(API_UPLOAD_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({}),
                timeout: 8000
            })
            .then(res => {
                if (!res.ok) throw new Error(`状态码: ${res.status}`);
                return res.json();
            })
            .then(result => {
                const data = result.data || {};
                const isNewData = result.hasRealData === true;
                // 更新UI（自动更新本地缓存）
                updateUI(data, isNewData);
                console.log(`✅ 数据加载成功 | 新数据: ${isNewData}`, data);
            })
            .catch(err => {
                // 接口异常/后端缓存丢了 → 显示本地永久缓存
                console.warn('⚠️ 接口异常，显示本地永久缓存:', err);
                updateUI(lastRealData, false);
            });
        }
    </script>
</body>
</html>
